<!DOCTYPE html>
<html>
<head>
    <title> Modulators of the Serotonin Receptor 2A </title>
</head>
<body>

    <h1> 5-HT2A Receptor and Ligands </h1>

    <h2>1. Receptor Data</h2>
  <button id="load-receptor-btn">Fetch Receptor Data</button>
  <pre id="receptor-output">Waiting...</pre>

  <h2>2. Ligands Data</h2>
  <button id="load-ligands-btn">Fetch Ligands Data</button>
  <pre id="ligands-output">Waiting...</pre>


    <script>
        const endpoint = 'https://query.wikidata.org/sparql';
        const receptorQuery = `
              SELECT DISTINCT ?receptorLabel ?group ?subType ?item ?itemLabel
      WHERE {
        BIND(wd:Q1949517 AS ?receptor)

        {
          ?receptor wdt:P681 ?item .
          BIND("structure" AS ?group)
          BIND("cell_component" AS ?subType)
        }
        UNION
        {
          ?receptor wdt:P361 ?item .
          BIND("structure" AS ?group)
          BIND("part_of" AS ?subType)
        }
        UNION
        {
          ?receptor wdt:P680 ?item .
          BIND("function" AS ?group)
          BIND("molecular_function" AS ?subType)
        }
        UNION
        {
          ?receptor wdt:P682 ?item .
          BIND("function" AS ?group)
          BIND("biological_process" AS ?subType)
        }

        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      }
    `;

        const ligandQuery = `
            SELECT ?molecule ?moleculeLabel ?molweight ?formula ?smiles ?roleLabel WHERE {
        VALUES ?molecule {
          wd:Q167934   # Serotonin
          wd:Q407217   # DMT
          wd:Q409150   # Psilocin
          wd:Q193140   # Mescaline
          wd:Q69488    # MDMA
          wd:Q415997   # Ketanserin
        }

        ?molecule wdt:P2067 ?molweight ;
                  wdt:P274 ?formula .

        OPTIONAL { ?molecule wdt:P233 ?smiles . }
        OPTIONAL { ?molecule wdt:P2868 ?role . }

        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      }
    `;


async function fetchWikidata(sparqlQuery) {
      const url = endpoint + "?query=" + encodeURIComponent(sparqlQuery) + "&format=json";
      const response = await fetch(url);
      const data = await response.json();
      return data.results.bindings;
    }

    const receptorBtn = document.getElementById("load-receptor-btn");
    const receptorOutput = document.getElementById("receptor-output");

    const ligandsBtn = document.getElementById("load-ligands-btn");
    const ligandsOutput = document.getElementById("ligands-output");

    receptorBtn.onclick = async function () {
      receptorOutput.textContent = "Loading receptor data...";
        const rows = await fetchWikidata(receptorQuery);
        receptorOutput.textContent = JSON.stringify(rows, null, 2);
      
    };
        
    ligandsBtn.onclick = async function () {
      ligandsOutput.textContent = "Loading ligands data...";
        const rows = await fetchWikidata(ligandQuery);
        ligandsOutput.textContent = JSON.stringify(rows, null, 2);
     
    };
    
  </script>

</body>
</html>
